services:
  survivegpnumanual:
    container_name: ${CONTAINER_NAME}
    image: survivegpnumanual:0.1.0
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:80
      - ${PANEL_APP_PORT_HTTPS}:443
    volumes:
      - /ssl:/etc/nginx/ssl:ro
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
